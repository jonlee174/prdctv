name: prdctv
options:
  bundleIdPrefix: com.jonathanlee
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TTM9BN6M53
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Must match prdctv/Shared/AppGroup.swift.
    APP_GROUP_ID: TTM9BN6M53.com.jonathanlee.prdctv
    IOS_APP_GROUP_ID: group.com.jonathanlee.prdctv
    ICLOUD_CONTAINER_ID: iCloud.com.jonathanlee.prdctv

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.10.0"

targets:
  prdctv:
    type: application
    platform: macOS
    sources:
      - path: prdctv/App
      - path: prdctv/Board
      - path: prdctv/QuickAdd
      - path: prdctv/Rewards
      - path: prdctv/Stats
      - path: prdctv/Calendar
      - path: prdctv/Import
      - path: prdctv/Shared
      - path: prdctv/Resources
    dependencies:
      - target: prdctvWidget
        embed: true
      - package: KeyboardShortcuts
    entitlements:
      path: prdctv/App/prdctv.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(ICLOUD_CONTAINER_ID)]
        com.apple.developer.aps-environment: development
    info:
      path: prdctv/App/Info.plist
      properties:
        CFBundleDisplayName: prdctv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.jonathanlee.prdctv
            CFBundleURLSchemes: [prdctv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.prdctv
        PRODUCT_NAME: prdctv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every size in AppIcon.icns, since Transporter and the App Store read the 1024 pixel icon from it.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        ENABLE_APP_SANDBOX: YES

  prdctvWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: prdctvWidget
      - path: prdctv/Shared
    entitlements:
      path: prdctvWidget/prdctvWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: prdctvWidget/Info.plist
      properties:
        CFBundleDisplayName: prdctv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.prdctv.widget
        PRODUCT_NAME: prdctvWidget
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  # iPhone / iPad app. Shares everything except the Mac-only board, menu bar,
  # settings and floating quick-add panel.
  prdctviOS:
    type: application
    platform: iOS
    sources:
      - path: prdctv/iOS
      - path: prdctv/Shared
      - path: prdctv/Board
        excludes: [BoardView.swift, ColumnView.swift]
      - path: prdctv/QuickAdd
        excludes: [QuickAddPanel.swift]
      - path: prdctv/Rewards
      - path: prdctv/Stats
      - path: prdctv/Calendar
      - path: prdctv/Import
      - path: prdctv/Resources
    dependencies:
      - target: prdctvWidgetiOS
        embed: true
    entitlements:
      path: prdctv/iOS/prdctviOS.entitlements
      properties:
        com.apple.security.application-groups: [$(IOS_APP_GROUP_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(ICLOUD_CONTAINER_ID)]
        aps-environment: development
    info:
      path: prdctv/iOS/Info.plist
      properties:
        CFBundleDisplayName: prdctv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jonathanlee.prdctv
            CFBundleURLSchemes: [prdctv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.prdctv
        PRODUCT_NAME: prdctv
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO

  prdctvWidgetiOS:
    type: app-extension
    platform: iOS
    sources:
      - path: prdctvWidget
        excludes: [Info.plist, "*.entitlements"]
      - path: prdctv/Shared
    entitlements:
      path: prdctvWidgetiOS/prdctvWidgetiOS.entitlements
      properties:
        com.apple.security.application-groups: [$(IOS_APP_GROUP_ID)]
    info:
      path: prdctvWidgetiOS/Info.plist
      properties:
        CFBundleDisplayName: prdctv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.prdctv.widget
        PRODUCT_NAME: prdctvWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO

  prdctvTests:
    type: bundle.unit-test
    platform: macOS
    # Pure logic only: compiled directly into the test bundle, no host app or signing needed.
    sources:
      - path: prdctvTests
      - path: prdctv/Shared/Models.swift
      - path: prdctv/Shared/RewardEngine.swift
      - path: prdctv/Shared/RewardSettings.swift
      - path: prdctv/Shared/AppGroup.swift
      - path: prdctv/Shared/Tags.swift
      - path: prdctv/Shared/DueLabel.swift
      - path: prdctv/Shared/Repeat.swift
      - path: prdctv/QuickAdd/QuickAddParser.swift
      - path: prdctv/Calendar/MonthGrid.swift
      - path: prdctv/Shared/UndoHistory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.prdctvTests
        CODE_SIGN_STYLE: Automatic

schemes:
  prdctv:
    build:
      targets:
        prdctv: all
        prdctvWidget: all
    run:
      config: Debug
    test:
      targets:
        - prdctvTests
  prdctviOS:
    build:
      targets:
        prdctviOS: all
        prdctvWidgetiOS: all
    run:
      config: Debug
