name: TicketBoard
options:
  bundleIdPrefix: com.jonathanlee
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TTM9BN6M53
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Must match TicketBoard/Shared/AppGroup.swift.
    APP_GROUP_ID: TTM9BN6M53.com.jonathanlee.TicketBoard

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.10.0"

targets:
  TicketBoard:
    type: application
    platform: macOS
    sources:
      - path: TicketBoard/App
      - path: TicketBoard/Board
      - path: TicketBoard/QuickAdd
      - path: TicketBoard/Rewards
      - path: TicketBoard/Stats
      - path: TicketBoard/Import
      - path: TicketBoard/Shared
      - path: TicketBoard/Resources
    dependencies:
      - target: TicketWidget
        embed: true
      - package: KeyboardShortcuts
    entitlements:
      path: TicketBoard/App/TicketBoard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.security.files.user-selected.read-only: true
    info:
      path: TicketBoard/App/Info.plist
      properties:
        CFBundleDisplayName: Ticket Board
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.jonathanlee.TicketBoard
            CFBundleURLSchemes: [ticketboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.TicketBoard
        PRODUCT_NAME: TicketBoard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES

  TicketWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TicketWidget
      - path: TicketBoard/Shared
    entitlements:
      path: TicketWidget/TicketWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: TicketWidget/Info.plist
      properties:
        CFBundleDisplayName: Ticket Board
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.TicketBoard.TicketWidget
        PRODUCT_NAME: TicketWidget
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  TicketBoardTests:
    type: bundle.unit-test
    platform: macOS
    # Pure logic only: compiled directly into the test bundle, no host app or signing needed.
    sources:
      - path: TicketBoardTests
      - path: TicketBoard/Shared/Models.swift
      - path: TicketBoard/Shared/RewardEngine.swift
      - path: TicketBoard/Shared/RewardSettings.swift
      - path: TicketBoard/Shared/AppGroup.swift
      - path: TicketBoard/QuickAdd/QuickAddParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlee.TicketBoardTests
        CODE_SIGN_STYLE: Automatic

schemes:
  TicketBoard:
    build:
      targets:
        TicketBoard: all
        TicketWidget: all
    run:
      config: Debug
    test:
      targets:
        - TicketBoardTests
